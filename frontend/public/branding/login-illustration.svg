<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d">
  <title id="t">Autonomous network maturity</title>
  <desc id="d">A cell tower and a core data centre linked through a network of nodes, beside a rising scale of autonomy levels L0 to L5.</desc>
  <!-- Login page illustration (ONBOARDING_SECURITY_PLAN.md Phase 5): white line art for the magenta hero panel. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- glass card -->
  <rect x="8" y="8" width="544" height="344" rx="22" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.28"/>

  <!-- ground -->
  <line x1="36" y1="300" x2="524" y2="300" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>

  <!-- cell tower -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 300 L92 120 L114 300"/>
    <path d="M78 236 L106 236 M83 190 L101 190 M87 152 L97 152"/>
    <path d="M78 236 L101 190 M106 236 L83 190 M83 190 L97 152 M101 190 L87 152"/>
    <path d="M86 128 h12 M84 112 v18 M100 112 v18"/>
  </g>
  <circle cx="92" cy="106" r="5" fill="#fff"/>
  <!-- radio waves -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M114 88 a32 32 0 0 1 0 36" stroke-width="3" stroke-opacity="0.9"/>
    <path d="M126 76 a50 50 0 0 1 0 60" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M138 64 a68 68 0 0 1 0 84" stroke-width="3" stroke-opacity="0.35"/>
    <path d="M70 88 a32 32 0 0 0 0 36" stroke-width="3" stroke-opacity="0.9"/>
    <path d="M58 76 a50 50 0 0 0 0 60" stroke-width="3" stroke-opacity="0.6"/>
  </g>

  <!-- network mesh -->
  <g stroke="#fff" stroke-opacity="0.55" stroke-width="2">
    <line x1="150" y1="210" x2="210" y2="160"/>
    <line x1="210" y1="160" x2="270" y2="200"/>
    <line x1="210" y1="160" x2="250" y2="110"/>
    <line x1="250" y1="110" x2="300" y2="140"/>
    <line x1="270" y1="200" x2="300" y2="140"/>
    <line x1="270" y1="200" x2="230" y2="255"/>
    <line x1="150" y1="210" x2="230" y2="255"/>
    <line x1="300" y1="140" x2="340" y2="190"/>
    <line x1="270" y1="200" x2="340" y2="190"/>
    <line x1="230" y1="255" x2="310" y2="236"/>
    <line x1="340" y1="190" x2="334" y2="236"/>
  </g>
  <g stroke="#fff" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.6" fill="none">
    <path d="M118 206 L150 210"/>
  </g>
  <!-- central automation node -->
  <circle cx="270" cy="200" r="46" fill="url(#glow)"/>
  <circle cx="270" cy="200" r="20" fill="#fff"/>
  <g fill="none" stroke="#e20074" stroke-width="3" stroke-linecap="round">
    <circle cx="270" cy="200" r="6"/>
    <path d="M270 188 v4 M270 208 v4 M258 200 h4 M278 200 h4 M261.5 191.5 l3 3 M275.5 205.5 l3 3 M261.5 208.5 l3 -3 M275.5 194.5 l3 -3"/>
  </g>
  <g fill="#fff">
    <circle cx="150" cy="210" r="7"/>
    <circle cx="210" cy="160" r="8"/>
    <circle cx="250" cy="110" r="6"/>
    <circle cx="300" cy="140" r="7"/>
    <circle cx="230" cy="255" r="7"/>
    <circle cx="340" cy="190" r="8"/>
  </g>

  <!-- core data centre -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
    <rect x="300" y="236" width="44" height="64" rx="5" fill="#fff" fill-opacity="0.12"/>
  </g>
  <g fill="#fff">
    <rect x="308" y="248" width="28" height="5" rx="2"/>
    <rect x="308" y="262" width="28" height="5" rx="2"/>
    <rect x="308" y="276" width="28" height="5" rx="2"/>
  </g>

  <!-- autonomy level scale L0 to L5 -->
  <g fill="url(#bar)">
    <rect x="386" y="276" width="18" height="24" rx="4"/>
    <rect x="410" y="258" width="18" height="42" rx="4"/>
    <rect x="434" y="236" width="18" height="64" rx="4"/>
    <rect x="458" y="210" width="18" height="90" rx="4"/>
    <rect x="482" y="180" width="18" height="120" rx="4"/>
    <rect x="506" y="146" width="18" height="154" rx="4" fill="#fff"/>
  </g>
  <g fill="#fff" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="395" y="318" fill-opacity="0.8">L0</text>
    <text x="419" y="318" fill-opacity="0.8">L1</text>
    <text x="443" y="318" fill-opacity="0.8">L2</text>
    <text x="467" y="318" fill-opacity="0.8">L3</text>
    <text x="491" y="318" fill-opacity="0.8">L4</text>
    <text x="515" y="318">L5</text>
  </g>
  <!-- trend arrow -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M384 246 Q 440 220 500 120"/>
    <path d="M486 122 L500 120 L503 134"/>
  </g>
  <text x="456" y="96" fill="#fff" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">AUTONOMY</text>
</svg>
